name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser-Tests
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/aublst-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null
          npm run test:e2e

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
      - name: PHP-Syntax prüfen
        run: find backend -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Backend-Tests
        run: php backend/tests/run.php

  integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: game_ops_dashboard
          MARIADB_USER: aublst
          MARIADB_PASSWORD: aublst-test
          MARIADB_ROOT_PASSWORD: root-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: game_ops_dashboard
      DB_USER: aublst
      DB_PASS: aublst-test
      REQUIRE_SESSION_PIN: "false"
      ENABLE_ANONYMOUS_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
      - name: Schema einspielen
        run: php backend/bin/maintenance.php migrate
      - name: API starten
        run: php -S 127.0.0.1:8080 -t . > /tmp/aublst-api.log 2>&1 &
      - name: Parallelzugriffe prüfen
        run: node scripts/load-smoke.mjs http://127.0.0.1:8080/backend/api.php '' 20
