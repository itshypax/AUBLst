<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    RewriteEngine On

    # Alte Adapter und gespeicherte Links dürfen weiter /frontend verwenden.
    # Apache übernimmt den Querystring automatisch; URL-Fragmente bleiben im Browser.
    RewriteRule ^frontend(?:/(.*))?$ /$1 [R=308,L,NE]

    <FilesMatch "\.(?:webp|png|jpg|jpeg|svg|woff2|mp3|m4a|wav)$">
        Header set Cache-Control "public, max-age=3600"
    </FilesMatch>
    <FilesMatch "^(?:index\.html|manifest\.webmanifest|sw\.js)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</Directory>

<LocationMatch "^/assets/.*\.(?:js|css)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
