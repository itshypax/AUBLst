services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: game_ops_dashboard
      MARIADB_USER: aublst
      MARIADB_PASSWORD: aublst-dev
      MARIADB_ROOT_PASSWORD: aublst-root-dev
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - aublst-dev-db:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: docker/php-dev.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: game_ops_dashboard
      DB_USER: aublst
      DB_PASS: aublst-dev
      CORS_ALLOW_ORIGIN: http://127.0.0.1:5173,http://localhost:5173
      REQUIRE_SESSION_PIN: "false"
      # Der eingebaute PHP-Server hat sonst einen Prozess, den der SSE-Stream 55 s belegt.
      PHP_CLI_SERVER_WORKERS: "8"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/app
    working_dir: /app
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/app"]

volumes:
  aublst-dev-db:
