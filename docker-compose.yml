services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: game_ops_dashboard
      MARIADB_USER: aublst
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD in .env setzen}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - aublst-db:/var/lib/mysql

  app:
    build:
      context: .
      args:
        VITE_APP_COMMIT: ${APP_VERSION:-docker}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: game_ops_dashboard
      DB_USER: aublst
      DB_PASS: ${DB_PASSWORD:?DB_PASSWORD in .env setzen}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-}
      REQUIRE_SESSION_PIN: ${REQUIRE_SESSION_PIN:-false}
      ENABLE_REALTIME_STREAM: ${ENABLE_REALTIME_STREAM:-true}
      ENABLE_ANONYMOUS_METRICS: ${ENABLE_ANONYMOUS_METRICS:-true}
      STATE_CACHE_SECONDS: ${STATE_CACHE_SECONDS:-5}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
    ports:
      - "${HTTP_PORT:-8080}:80"

  api-v2:
    build:
      context: .
      dockerfile: server/Aublst.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Database: "Server=db;Port=3306;Database=game_ops_dashboard;User ID=aublst;Password=${DB_PASSWORD:?DB_PASSWORD in .env setzen};Pooling=true;Maximum Pool Size=40;Connection Timeout=5;Default Command Timeout=15"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v2/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  aublst-db:
